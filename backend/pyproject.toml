[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nh-library-backend"
version = "0.1.0"
requires-python = ">=3.12"

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "B008"]  # B008 is standard for FastAPI Depends

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "testcontainers.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"
env = [
    "SECRET_KEY=test-secret-key-not-for-production",
    "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/library",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = [
    "app/grpc/generated/*",
    "app/main.py",
    # Repository layer has 0% unit coverage by design — covered by integration tests.
    "app/repositories/*",
]

[tool.coverage.report]
# Unit tests cover models + config. Integration tests (CI/Testcontainers) cover repos.
# Raise to 80% in Phase 3 once service + API layers are added.
fail_under = 80
show_missing = true
